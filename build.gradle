plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'fr.project'
version = '0.0.1-SNAPSHOT'
description = 'Moteur de planification OptaPlanner'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom "org.optaplanner:optaplanner-bom:9.44.0.Final"
	}
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.optaplanner:optaplanner-spring-boot-starter'

    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.optaplanner:optaplanner-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

}

test {
    // Le filtrage qui vivait ici — include 'fr/project/**', exclude 'com/**' — servait à tenir
    // les tests du POC hors de la suite. Le POC a ete retire le 2026-08-18 : il n'y a plus rien
    // a exclure, et un filtre qui ne filtre plus finit par masquer un test qu'on croyait joue.
    useJUnitPlatform()
}
