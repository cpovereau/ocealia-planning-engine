# =====================================================================
#  Réglages du moteur de planification
# ---------------------------------------------------------------------
#  Ce fichier doit rester dans un dossier nommé exactement "config",
#  placé à côté du dossier "moteur". C'est là que le moteur le cherche.
#
#  Toute modification demande un redémarrage.
#  Une ligne qui commence par # est ignorée : c'est un commentaire.
# =====================================================================


# ---------------------------------------------------------------------
#  1. Le temps de réflexion  —  LE RÉGLAGE LE PLUS IMPORTANT
# ---------------------------------------------------------------------
#  Le moteur essaie un très grand nombre de répartitions et garde la
#  meilleure trouvée dans le temps qu'on lui laisse. Plus de temps,
#  meilleure réponse.
#
#  Il n'y a aucun risque à être généreux : la réponse est toujours
#  valide, seulement moins bonne s'il a eu peu de temps. En revanche il
#  ne rend rien avant la fin du délai, même s'il a fini plus tôt.
#
#  La valeur s'exprime en SECONDES, sous forme d'un nombre entier.
#
#      1   essais rapides, petit planning
#      3   valeur d'usine si cette ligne est absente
#     10   usage courant          <-- point de départ raisonnable
#     60   planning large (un trimestre, beaucoup de personnes)

planning.solver.timeLimitSeconds=10


# ---------------------------------------------------------------------
#  2. Le port réseau
# ---------------------------------------------------------------------
#  Le numéro de porte sur lequel le moteur écoute les appels directs.
#  À changer si un autre programme occupe déjà ce numéro.

server.port=8082


# ---------------------------------------------------------------------
#  3. Le répertoire d'écoute (mode fichier)
# ---------------------------------------------------------------------
#  false coupe complètement la surveillance des dossiers.

file-adapter.enabled=true

#  Délai entre deux coups d'oeil dans la boîte de dépôt, en
#  millisecondes. 5000 = toutes les 5 secondes.

file-adapter.polling-interval-ms=5000

#  Taille maximale d'un fichier accepté, en octets. 10485760 = 10 Mo.
#  Un fichier plus gros part dans le dossier "error".

file-adapter.max-input-file-size-bytes=10485760

#  Les cinq dossiers d'échange. Ils sont créés automatiquement.
#  Les chemins peuvent pointer sur un partage réseau.
#
#  ATTENTION : ne faites jamais pointer deux moteurs sur la même boîte
#  de dépôt. Le mécanisme qui évite de traiter deux fois le même fichier
#  protège un moteur contre lui-même, pas deux moteurs l'un contre
#  l'autre.

file-adapter.paths.inbox=data/file-adapter/inbox
file-adapter.paths.processing=data/file-adapter/processing
file-adapter.paths.outbox=data/file-adapter/outbox
file-adapter.paths.error=data/file-adapter/error
file-adapter.paths.archive=data/file-adapter/archive


# ---------------------------------------------------------------------
#  4. Les journaux
# ---------------------------------------------------------------------
#  INFO  : une ligne par fichier traité. Recommandé.
#  DEBUG : très bavard, pour comprendre un comportement inattendu.
#  WARN  : uniquement les anomalies.

logging.level.org.optaplanner=INFO
logging.level.fr.project.planning=INFO


# ---------------------------------------------------------------------
#  5. Réglages techniques — à ne pas modifier
# ---------------------------------------------------------------------
#  Un champ inconnu dans une demande est refusé, jamais ignoré en
#  silence : c'est ce qui permet de détecter une faute de frappe dans
#  un nom de champ plutôt que de la subir.

spring.jackson.deserialization.fail-on-unknown-properties=true

#  Base technique interne, en mémoire. Le moteur ne stocke rien.

spring.datasource.url=jdbc:h2:mem:plannerdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
