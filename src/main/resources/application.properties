spring.application.name=planning-solver

# === Contrat d'entrée : un champ inconnu est refusé, jamais ignoré ===
spring.jackson.deserialization.fail-on-unknown-properties=true

# === Datasource H2 (en mémoire) ===
spring.datasource.url=jdbc:h2:mem:plannerdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# === Console H2 (optionnelle) ===
spring.h2.console.enabled=true

server.port=8082

optaplanner.solver.termination.spent-limit=1s

logging.level.org.optaplanner=INFO
logging.level.org.hibernate=ERROR

# === FileAdapeter ===
file-adapter.enabled=true
file-adapter.polling-interval-ms=5000

file-adapter.paths.inbox=data/file-adapter/inbox
file-adapter.paths.processing=data/file-adapter/processing
file-adapter.paths.outbox=data/file-adapter/outbox
file-adapter.paths.error=data/file-adapter/error
file-adapter.paths.archive=data/file-adapter/archive
